name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    # arm64 is a bonus: its failure must not hold back the x86_64 release.
    continue-on-error: ${{ matrix.arch == 'aarch64' }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches desktop/package.json
        run: |
          want="v$(node -p 'require("./package.json").version')"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but desktop/package.json says $want"; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - name: Name the AppImage
        run: |
          # electron-builder already says x86_64 for x64 AppImages, but arm64 not aarch64.
          app="$(ls dist/*.AppImage | head -n1)"
          want="dist/hqterm-desktop-linux-${{ matrix.arch }}.AppImage"
          [ "$app" = "$want" ] || mv "$app" "$want"
          ls -la dist
      - name: Smoke test under Xvfb
        run: |
          if ! command -v xvfb-run >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq xvfb; fi
          HQTERM_DESKTOP_SMOKE=8000 XDG_CONFIG_HOME="$RUNNER_TEMP/cfg" xvfb-run -a "dist/hqterm-desktop-linux-${{ matrix.arch }}.AppImage" --appimage-extract-and-run --no-sandbox 2>&1 | grep -v appimage_extracted | tee smoke.log
          grep -q "hqterm-desktop smoke: ok" smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.arch }}
          path: desktop/dist/hqterm-desktop-linux-${{ matrix.arch }}.AppImage

  release:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Tag matches package.json
        run: |
          want="v$(bun -e 'console.log(require("./package.json").version)')"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but package.json says $want"; exit 1; }
      - name: Build binaries
        run: |
          mkdir -p dist
          for t in linux-x64:linux-amd64 linux-arm64:linux-arm64 darwin-x64:darwin-amd64 darwin-arm64:darwin-arm64; do
            target="bun-${t%%:*}"; name="hqterm-${t##*:}"
            bun build --compile --minify --target="$target" src/main.ts --outfile "dist/$name"
          done
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cp desktop/build/icon.png dist/hqterm-desktop.png
          cd dist && sha256sum hqterm-* > SHA256SUMS && cat SHA256SUMS
      - name: Smoke test
        run: ./dist/hqterm-linux-amd64 --version
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "hqterm $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/hqterm-* dist/SHA256SUMS install.sh --clobber
