name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc -p .
      - run: sh -n install.sh && bash -n install.sh
      - run: bun build --compile src/main.ts --outfile dist/hqterm && ./dist/hqterm --version

  # The Windows installer for real: download, verify, install, PATH, twice
  # (a re-run over an existing hqsh.exe must work too).
  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.ps1 (Windows PowerShell)
        shell: powershell
        run: ./install.ps1
      - name: install.ps1 again (pwsh), then hqsh runs from the user PATH
        shell: pwsh
        run: |
          ./install.ps1
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + $env:Path
          hqsh version
          if ($LASTEXITCODE -ne 0) { exit 1 }

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Build AppImage
        run: npm run dist
      - name: Smoke test under Xvfb (window, PTYs, images, split, layout restore)
        run: |
          ls -la dist
          app="$(ls dist/*.AppImage | head -n1)"
          smoke() {
            HQTERM_DESKTOP_SMOKE=10000 HQTERM_DESKTOP_SMOKE_SHOT="$PWD/$1" XDG_CONFIG_HOME="$RUNNER_TEMP/cfg" \
              xvfb-run -a -s "-screen 0 1280x800x24" "$app" --appimage-extract-and-run --no-sandbox 2>&1 | grep -v appimage_extracted | tee "$1.log"
          }
          # First launch: one shell, then Ctrl+Shift+D splits it (2 PTYs).
          smoke smoke-1.png
          grep -q "hqterm-desktop smoke: ok (ptys=2)" smoke-1.png.log
          cat "$RUNNER_TEMP/cfg/hqterm/desktop-layout.json"
          # Second launch restores both panes, then splits again (3 PTYs).
          smoke smoke-2.png
          grep -q "hqterm-desktop smoke: ok (ptys=3)" smoke-2.png.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hqterm-desktop-smoke-screenshot
          path: desktop/smoke-*.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: hqterm-desktop-linux-x86_64
          path: desktop/dist/*.AppImage
          retention-days: 7

  # macOS (both CPUs) and Windows: build the installers, then launch the
  # unpacked app twice for real (window, PTYs, split, layout restore).
  desktop-mac-win:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, os: mac, arch: arm64 }
          - { runner: macos-15-intel, os: mac, arch: x64 }
          - { runner: windows-latest, os: win, arch: x64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Build
        run: |
          # hdiutil sometimes cannot eject the dmg ("Resource busy"), mostly
          # from Spotlight indexing it: turn that off and retry.
          if [ "${{ matrix.os }}" = mac ]; then sudo mdutil -a -i off >/dev/null 2>&1 || true; fi
          for i in 1 2 3; do
            npm run dist:${{ matrix.os }} -- --${{ matrix.arch }} && exit 0
            echo "build attempt $i failed"; sleep 10
          done
          exit 1
        env:
          CSC_FOR_PULL_REQUEST: "true"
      - name: List and check the build
        run: |
          ls -la dist
          if [ "${{ matrix.os }}" = mac ]; then ls dist/mac*; codesign --verify --deep --strict --verbose=2 dist/mac*/*.app; fi
      - name: Smoke test
        run: |
          if [ "${{ matrix.os }}" = mac ]; then exe="$(ls dist/mac*/*.app/Contents/MacOS/* | head -n1)"; else exe="$(ls dist/win*-unpacked/*.exe | head -n1)"; fi
          echo "launching $exe"
          scripts/ci-smoke.sh "$exe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hqterm-desktop-smoke-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            desktop/smoke-*.png
            desktop/smoke-*.log
          retention-days: 7
